name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies 🔧
        run: npm ci

      - name: Build 🏗️
        env:
          # Inject secrets from GitHub Actions Secrets
          VITE_GAS_API_URL: ${{ secrets.VITE_GAS_API_URL }}
          VITE_DEFAULT_CURRENCY: ${{ vars.VITE_DEFAULT_CURRENCY || 'TWD' }}
          VITE_CACHE_TTL: ${{ vars.VITE_CACHE_TTL || 3600 }}
          VITE_ENABLE_DEBUG: ${{ vars.VITE_ENABLE_DEBUG || 'false' }}
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
